# Institutional Deterministic Trading Compliance Policy Configuration (Step 5.1)
# Version: 1.0.0
# Scope: Centralized safety gates, entry/exit score thresholds, and precedence rules.

version: "1.0.0"
policy_name: "Institutional Deterministic Compliance Policy"

# =============================================================================
# 1. COMPOSITE SCORE FLOORS & CEILINGS
# =============================================================================
scores:
  # Minimum deterministic composite score (0-100) required to certify a standard long entry
  buy_minimum: 60.0
  # Minimum composite score required for a certified catalyst dip-buy
  dip_buy_minimum: 48.0
  # Maximum composite score permitted to certify a directional short entry
  short_maximum: 45.0
  # Score threshold above which an existing long holding's thesis is considered intact
  holding_thesis_minimum: 70.0

# =============================================================================
# 2. CATALYST DIP-BUY SEPARATE BRANCH SPECIFICATION
# =============================================================================
# The dip-buy branch is defined distinctly from standard momentum/trend entries.
# It buys an adverse-catalyst dislocation with sound valuation rather than technical momentum.
dip_buy:
  enabled: true
  # Branch-specific composite floor (dislocation discounts trend score by design)
  score_minimum: 48.0
  # Required 5-day price drop percentage window
  min_drop_pct_5d: 5.0
  max_drop_pct_5d: 30.0
  # RSI boundaries: must be oversold but not in an unrecoverable structural collapse
  min_rsi: 20.0
  max_rsi: 45.0
  # Fundamental valuation anchors: business must remain cheap vs history and peers
  min_valuation_history: 60.0
  min_peer_valuation: 55.0
  # Volume surge confirming institutional liquidation absorption
  min_rvol: 1.2
  # Maximum recency of the adverse news trigger
  max_catalyst_age_days: 3
  # Prohibit dip-buys into confirmed balance sheet value traps
  forbid_value_trap: true
  forbid_collapse: true
  # Confidence hurdle and catalyst conviction boost for verified dislocation setups
  min_confidence_threshold: 0.55
  catalyst_confidence_boost: 0.15
  catalyst_confidence_ceiling: 0.85

# =============================================================================
# 2b. TREND PULLBACK CANDIDATE SETUP SPECIFICATION
# =============================================================================
# Distinct from catalyst dip-buys: buys an orderly, low-volume consolidation /
# moving average test within an established multi-month uptrend, without requiring
# any adverse news catalyst.
pullback:
  enabled: true

  # 1. Intact Longer-Term Trend Definition
  composite_minimum: 60.0
  min_trend_score: 60.0
  require_above_ema50: true
  require_ema50_above_ema200: true

  # 2. Pullback Area Definition (Price level / Moving Average)
  anchor_ema: "ema20"
  max_distance_to_anchor_atr: 1.50
  min_pullback_drop_pct: 1.5
  max_pullback_drop_pct: 8.0
  min_range_proximity: 0.20
  max_range_proximity: 0.75

  # 3. Stabilization / Reclaim Confirmation
  rsi_min: 40.0
  rsi_max: 55.0
  require_stabilization: true
  min_reward_risk: 1.20

  # 4. Volume & Relative-Strength Conditions
  max_pullback_rvol: 1.50
  min_sector_relative_score: 50.0
  min_market_alpha_score: 50.0

  # 5. Maximum Extension, Event & Volatility Exclusions
  max_extension_atr: 2.0
  exclude_earnings_blackout: true
  max_vol_factor: 2.50
  forbid_value_trap: true

# =============================================================================
# 3. TRADE QUALITY & SETUP GEOMETRY
# =============================================================================
trade_quality:
  # Minimum channel-anchored upside-to-downside reward-to-risk ratio
  reward_risk_minimum: 1.20
  # Minimum data completeness percentage required across all 5 quantitative pillars
  min_data_completeness: 0.80
  # Minimum relative volume (20-day ratio) required for tradeable liquidity
  min_rvol_20d: 0.50
  # Minimum 20-day average daily dollar turnover in USD
  min_avg_dollar_volume: 1000000.0
  # Chase filter: distance to 20-day high in ATRs (values below threshold indicate extended chase)
  max_distance_to_resistance_atr: 0.80
  # Wall Street target sanity ratio: street 12M target vs entry price
  min_wall_street_rr: 1.0
  # Maximum permissible stop loss distance as a percentage of entry price (e.g. 30%)
  max_stop_distance_pct: 0.30
  # Expected slippage per execution leg in basis points (5 bps = 0.05%)
  slippage_bps: 5.0
  # Transaction commissions and regulatory fees per execution leg in basis points
  commission_bps: 1.0
  # Minimum statistical edge: win_probability must exceed net break-even win rate by at least this fraction
  min_edge_pct: 0.02
  # Require strictly positive mathematical expectancy E[R] > 0 after accounting for transaction costs
  require_positive_expectancy: true
  # Maximum order participation rate relative to 20-day Average Daily Volume (ADV) (1.0% = 0.01)
  max_participation_rate: 0.01
  # Maximum permissible estimated market impact in basis points (square-root model)
  max_market_impact_bps: 15.0
  # Empirically justified gated confidence threshold required for directional entry (Gate 5)
  min_confidence_threshold: 0.65

# =============================================================================
# 4. EVENT RISKS & SCHEDULED BLACKOUTS
# =============================================================================
events:
  # Number of trading sessions preceding scheduled earnings report triggering mandatory HOLD
  earnings_blackout_sessions: 3
  # Allow pre-earnings directional trading with an event sizing haircut
  allow_pre_earnings_trading: true
  earnings_risk_haircut: 0.50
  # Whether scheduled company event risks (investor days, regulatory decisions) force HOLD
  event_risk_blackout: true
  # Number of days preceding ex-dividend date during which new short sales are prohibited
  ex_dividend_short_blackout_days: 2

# =============================================================================
# 5. VOLATILITY NOISE & OPTION REGIMES
# =============================================================================
volatility:
  # Minimum ATR volatility dampening factor (vol_factor < 0.80 triggers volatility veto)
  min_vol_factor: 0.80
  # Maximum ratio of stop-loss distance to option-implied expected move
  max_stop_expected_move_ratio: 0.85
  # Minimum stop distance noise multiple: stop must clear >= 0.85 * 1-sigma move to avoid price-noise shakeout
  min_stop_noise_multiple: 0.85
  # Horizon in trading days for options 1-sigma expected move calculation
  option_horizon_days: 20
  # Lookback window in trading days for realized volatility fallback when options are missing
  realized_vol_fallback_window: 20
  # Reject entries when market regime is classified as extreme tail-risk volatility
  reject_extreme_regime: true

# =============================================================================
# 6. DATA QUALITY & FRESHNESS CONTRACTS
# =============================================================================
data_quality:
  # Reject entries if market prices, ATR, or technical indicators are stale or non-positive
  require_fresh_market_data: true
  # Reject entries for in-scope tickers if ML model predictions are stale or missing
  require_fresh_ml_data_for_in_scope_tickers: true
  # Maximum allowable staleness (in calendar days) for market data snapshots
  max_market_data_staleness_days: 5
  # Maximum allowable staleness (in calendar days) for ML predictions
  max_ml_score_staleness_days: 5
  # Data outage policy (Step 5.4): Strictly block new entries during data outage
  block_new_entries_on_outage: true
  # Inviolable Invariant: NEVER silently substitute neutral-looking scores (e.g. 50.0) during an outage
  allow_neutral_score_substitution: false
  # Separate fail-safe policy for open positions during data outage (never ignore open risk)
  enable_open_position_failsafe: true
  # Maximum duration in hours to maintain open position surveillance during quote outage before emergency alert
  max_outage_tolerance_hours: 2.0

# =============================================================================
# 7. HOLDING THESIS GUARD (PREVENT PREMATURE EXITS)
# =============================================================================
holding_guard:
  enabled: true
  # Composite threshold for active holdings to prevent premature stopouts on noise
  thesis_intact_score_minimum: 70.0
  # If true, an active long position with intact thesis is converted from SELL to HOLD
  prevent_premature_exit: true
  # Mandatory forced exit exceptions that must NEVER be blocked by the holding guard:
  never_block_stop_breach: true
  never_block_critical_evidence_veto: true
  never_block_earnings_blackout: true
  # Catastrophic composite collapse floor: exits are never blocked if composite falls below this
  catastrophic_composite_floor: 50.0

# =============================================================================
# 8. GOVERNANCE & EXECUTION POLICY
# =============================================================================
policy:
  # Strict Invariant: The LLM functions purely as an evidence service and CANNOT authorize orders
  llm_has_execution_authority: false
  # If data is missing, ambiguous, or gates fail, default unconditionally to HOLD
  fail_closed_for_new_entries: true
  # Enable deterministic veto when qualitative evidence uncovers critical fraud/litigation
  enable_evidence_veto: true
  # Enable deterministic veto when financial solvency indicates a value trap
  enable_value_trap_veto: true

# =============================================================================
# 9. SIGNAL STRENGTH & CONFIDENCE FORMALIZATION (STEP 5.5)
# =============================================================================
signal_strength:
  # Score decisiveness neutral anchor (D = |S - neutral_score_anchor| / 50.0)
  neutral_score_anchor: 50.0
  # Dispersion metric across normalized pillar scores: 'mad', 'std', or 'range'
  dispersion_metric: "mad"
  # Maximum theoretical dispersion scale for normalization (50.0 for [0, 100] scores)
  max_dispersion_scale: 50.0
  # Minimum valid pillars required for consensus dispersion calculation
  min_valid_pillars: 3
  # Default agreement when fewer than min_valid_pillars are present
  fallback_agreement: 0.50
  # Combination method: 'hierarchical_gated', 'linear_weighted', or 'geometric'
  combination_method: "hierarchical_gated"
  # Weights for Hierarchical Gated combination:
  weight_decisiveness: 0.70
  weight_agreement: 0.30
  # Completeness blend factor (0.50 + 0.50 * completeness)
  completeness_blend_weight: 0.50
  # Direct linear combination weights (must sum to 1.0)
  linear_weight_decisiveness: 0.50
  linear_weight_agreement: 0.25
  linear_weight_completeness: 0.25
  # Non-directional HOLD confidence ceiling
  hold_ceiling: 0.60
  # Directional entry threshold (signal strength >= 0.65)
  min_signal_strength_threshold: 0.65
  # Explicit labeling: Not an empirical win/profit probability until calibrated
  is_calibrated_probability: false

# =============================================================================
# 10. PORTFOLIO RISK & POSITION SIZING (STEP 7.1 & STEP 7.2)
# =============================================================================
portfolio_risk:
  # Baseline portfolio equity in USD
  default_portfolio_equity: 100000.0
  # Maximum permissible fraction of portfolio equity risked per trade (1.0% = 0.010)
  max_risk_fraction_per_trade: 0.010
  # Maximum position market value as fraction of portfolio equity (10% = 0.10)
  max_position_equity_pct: 0.10
  # Maximum single-stock exposure (default 10%)
  max_single_stock_pct: 0.10
  # Maximum participation rate of 20-day Average Daily Volume (1.0% = 0.01)
  max_adv_participation_pct: 0.01
  # Maximum permitted gross portfolio exposure (1.00 = 100% unleveraged)
  max_gross_exposure_pct: 1.00
  # Gap risk reserve expressed as multiple of ATR (G = 0.50 * ATR)
  gap_risk_atr_multiple: 0.50
  # Fallback price gap risk percentage when ATR is unavailable (1.0% = 0.01)
  default_gap_risk_pct: 0.01
  # Invariant: Do not automatically give a score of 90 a larger risk budget than a score of 70
  allow_score_budget_scaling: false
  # Minimum executable share count
  min_trade_size_shares: 1

  # --- Step 7.2 Portfolio-Level Controls ---
  # Maximum aggregate exposure permitted in any single economic/GICS sector (25% = 0.25)
  max_sector_pct: 0.25
  # Maximum combined exposure to any correlated factor cluster in the 25-stock universe (30% = 0.30)
  max_correlated_factor_pct: 0.30
  # Maximum absolute net exposure (|Long - Short| / Equity) (80% = 0.80)
  max_net_exposure_pct: 0.80
  # Minimum unencumbered cash reserve buffer (10% = 0.10)
  min_cash_reserve_pct: 0.10
  # Drawdown warning threshold from high-water mark triggering risk de-risking (5% = 0.05)
  drawdown_warning_pct: 0.05
  # Drawdown circuit breaker halt threshold freezing all new risk entries (10% = 0.10)
  drawdown_halt_pct: 0.10
  # Risk budget fraction multiplier during de-risking regime (0.50x normal risk)
  drawdown_dampener_factor: 0.50
  # Maximum allowable days to liquidate portfolio at 1% ADV participation
  max_portfolio_liquidation_days: 3.0

  # --- Step 7.2 Short Eligibility & Financing Checks ---
  # Maximum allowable annualized borrow fee in basis points (500 bps = 5.0% annual)
  short_borrow_fee_max_bps: 500.0
  # Additional cash margin collateral required for short positions (50% Reg-T margin)
  short_margin_requirement_pct: 0.50
  # Minimum reward-to-risk ratio required to certify directional short entry (1.50 vs 1.20 for long)
  short_min_rr_threshold: 1.50
  # Minimum RSI required to authorize short (blocks shorting into exhausted oversold panic)
  short_min_rsi_threshold: 25.0
  # Require structural trend breakdown (price < EMA20 and price < EMA50) before opening short
  short_require_trend_breakdown: true
  # Prohibit shorting into fortress-quality value stocks (squeeze trap guard)
  short_forbid_high_quality_value: true

# =============================================================================
# 10b. STAGED ENTRIES & RISK BUDGET GOVERNANCE (STEP 5)
# =============================================================================
# Sizes staged entries against one fixed risk budget for the total position.
# Decides maximum position risk in advance; prohibits treating each tranche as an independent risk allowance.
staged_entries:
  enabled: true
  # Maximum number of staged entry tranches per position
  max_tranches: 3
  # Advance planned tranche risk allocation weights (must sum to 1.0)
  tranche_weights: [0.50, 0.30, 0.20]
  # Minimum risk budget in dollars required to justify executing a tranche
  min_tranche_risk_dollars: 25.0
  # Strict Invariant: Averaging down a losing position is unconditionally prohibited
  require_profit_for_addition: true
  # Minimum unrealized profit in ATR multiples required to authorize subsequent tranche
  min_profit_atr_for_addition: 0.50
  # Minimum composite score required to qualify an additional tranche
  min_addition_composite_score: 60.0
  # Maximum adverse excursion in ATR from entry before addition is cancelled
  max_adverse_excursion_atr: 1.0
  # Exclude staged additions during earnings or binary corporate event blackout
  exclude_during_event_blackout: true

# =============================================================================
# 10. ORDER EXECUTION & OPERATIONAL SAFETY CONTROLS (Step 7.3)
# =============================================================================
execution:
  # Maximum allowed staleness of market quotes in seconds before rejecting entry
  max_quote_staleness_seconds: 300.0
  # Maximum allowed price drift percentage between signal generation and order routing (2.0% = 0.02)
  max_price_drift_pct: 0.02
  # Maximum participation rate of 20-day ADV (1.0% = 0.01)
  max_adv_participation_pct: 0.01
  # Maximum permissible estimated market impact in basis points (square-root model)
  max_market_impact_bps: 15.0
  # Default commission per share in USD
  default_commission_per_share: 0.005
  # Minimum commission per order in USD
  min_commission_per_order: 1.00
  # Prevent duplicate order submissions and enforce idempotency
  enable_idempotency_enforcement: true
  # Trip kill switch automatically when order reconciliation detects position discrepancy
  kill_switch_on_reconciliation_failure: true
  # Trip kill switch automatically on market data feed outage or staleness
  kill_switch_on_data_failure: true
  # Trip kill switch automatically when drawdown exceeds circuit breaker halt threshold
  kill_switch_on_drawdown_halt: true

# =============================================================================
# 11. SHADOW TRADING & DUAL-PILLAR PROMOTION CRITERIA (Step 8)
# =============================================================================
# Promotion Invariant:
# Backtested performance alone is hypothetical and NEVER qualifies for promotion.
# Live shadow trading alone without out-of-sample backtesting NEVER qualifies.
# The strategy must pass BOTH out-of-sample historical evaluation and shadow trading.
shadow_trading:
  # --- Pillar 1: Historical Out-of-Sample Backtest Promotion Hurdles ---
  # Minimum independent trades evaluated across out-of-fold historical data (2022-2026)
  min_historical_trades: 50
  # Minimum required CAGR percentage for PULLBACK_BUY setups
  min_pullback_cagr_pct: 0.0
  # Minimum required CAGR percentage for CATALYST_DIP_BUY setups
  min_catalyst_dip_cagr_pct: 0.0
  # Maximum allowable drawdown percentage across 2022-2026 out-of-fold window
  max_historical_drawdown_pct: 20.0
  # Minimum percentage of peak open profit retained after trims and trailing stops
  min_profit_retained_after_trims_pct: 50.0
  # Maximum permissible trade stop-out rate percentage
  max_stop_out_rate_pct: 50.0
  # Require positive net PnL in untuned forward holdout window (2025-2026)
  require_holdout_positive_pnl: true

  # --- Pillar 2: Live Shadow Trading Period Promotion Hurdles ---
  # Minimum independent observations required to evaluate promotion
  min_observations_for_promotion: 20
  # Minimum signal reproducibility rate (1.00 = 100% deterministic reproducibility)
  min_reproducibility_rate: 0.99
  # Maximum permissible quote freshness violation rate (1% = 0.01)
  max_freshness_violation_rate: 0.01
  # Maximum allowable 95th-percentile pipeline decision latency in seconds
  max_p95_latency_seconds: 10.0
  # Minimum Spearman rank Information Coefficient (IC) required
  min_spearman_ic: 0.00
  # Minimum directional accuracy threshold (50% = 0.50)
  min_directional_accuracy: 0.50
  # Minimum net expectancy percentage required after realistic execution slippage and commissions
  min_net_expectancy_pct: 0.00
  # Minimum profit factor (gross gains / gross losses)
  min_profit_factor: 1.00
  # Maximum Population Stability Index (PSI) feature drift tolerance
  max_feature_psi: 0.25
  # Zero tolerance for temporal data leakage or look-ahead bias in evidence retrieval
  max_temporal_leakage_rate: 0.00
  # Zero tolerance for ledger position or cash reconciliation mismatch
  max_reconciliation_error_rate: 0.00
  # Maximum allowable portfolio drawdown percentage
  max_drawdown_pct: 0.10
